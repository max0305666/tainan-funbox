<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>台南 Funbox 自動抽選</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="eyebrow">FUNBOX · TAINAN</div>
    <h1>台南 Funbox<br>自動抽選</h1>
    <p>最新店家公告、抽選品項與 LINE 連結集中管理</p>
  </div>
</header>

<main>
<section class="notice card">
  <div class="section-title"><div><span class="kicker">LATEST</span><h2>最新店家公告</h2></div><span id="lastSync" class="sync">讀取中…</span></div>
  <div id="posts"></div>
</section>

<section class="card">
  <div class="section-title"><div><span class="kicker">SHOPS</span><h2>選擇店家</h2></div></div>
  <div id="shops" class="shop-grid"></div>
</section>

<section class="card">
  <div class="section-title"><div><span class="kicker">ITEMS</span><h2>抽選品項</h2></div><button id="selectAll" class="text-btn">全選</button></div>
  <div id="items"></div>
</section>

<section class="control card">
  <div class="progress-row">
    <div><span class="muted">目前進度</span><strong id="progress">0 / 0</strong></div>
    <div><span class="muted">目前項目</span><strong id="current">尚未開始</strong></div>
  </div>
  <div class="status" id="status"><span class="dot"></span>待機中</div>
  <div class="actions">
    <button id="start" class="primary">▶ 開始自動抽選</button>
    <button id="stop" class="secondary">■ 停止</button>
  </div>
  <p class="hint">目前版本會依序開啟 LINE 抽選連結；LINE App 內的按鈕操作需搭配手機端自動化。</p>
</section>
</main>

<footer>資料來源可由後端自動同步 Facebook 公告 · GitHub Pages 前端</footer>
<script src="assets/app.js"></script>
</body>
</html>
