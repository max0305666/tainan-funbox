<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#4f46e5"
    >

    <meta
        name="description"
        content="台南 Funbox 抽選助手，快速整理各店家 LINE 抽選連結。"
    >

    <title>台南 Funbox 抽選助手</title>

    <link
        rel="stylesheet"
        href="assets/style.css"
    >

</head>


<body>


    <!-- =====================================================
         Hero
    ====================================================== -->

    <header class="hero">

        <div class="hero-inner">

            <h1>
                台南 Funbox 抽選助手

                <section>

                    <div id="lastSync">
                        資料載入中…
                    </div>

                </section>
                
            </h1>
            
            <p>
                選擇店家與品項，依序開啟 LINE 抽選
            </p>

        </div>

    </header>


    <!-- =====================================================
         Main
    ====================================================== -->

    <main>


        <!-- =================================================
             最新店家公告
        ================================================== -->

        <section class="section">

            <h2>
                📢 最新店家公告
            </h2>

            <div id="posts">

                <div class="muted">
                    正在載入店家資料…
                </div>

            </div>

        </section>


        <!-- =================================================
             店家選擇
        ================================================== -->

        <section class="section">

            <h2>
                🏪 選擇店家
            </h2>

            <div id="shops">

                <div class="muted">
                    正在載入店家…
                </div>

            </div>

        </section>


        <!-- =================================================
             抽選控制
        ================================================== -->

        <section class="section control-panel">

            <h2>
                🎲 抽選控制
            </h2>


            <!-- 進度 -->

            <div class="progress-info">

                <span id="progress">
                    0 / 0
                </span>

                <span id="current">
                    尚未開始
                </span>

            </div>


            <!-- 進度條 -->

            <div class="progress-track">

                <div id="progressBar"></div>

            </div>


            <!-- 狀態 -->

            <div id="status">

                <span class="dot"></span>

                等待開始抽選

            </div>


            <!-- 操作按鈕 -->

            <div class="controls">

                <button
                    type="button"
                    id="start"
                >
                    🎲 開始抽選
                </button>


                <button
                    type="button"
                    id="next"
                    disabled
                >
                    ➜ 下一個
                </button>


                <button
                    type="button"
                    id="stop"
                    disabled
                >
                    ■ 停止
                </button>

            </div>


            <!-- 完成畫面 -->

            <div id="completion"></div>


        </section>


        <!-- =================================================
             抽選品項
        ================================================== -->

        <section class="section">

            <h2>
                🎯 選擇抽選品項
            </h2>


            <div class="selection-bar">

                <span id="selectionInfo">
                    已選 0 / 0 項
                </span>


                <button
                    type="button"
                    id="selectAll"
                >
                    ☐ 全選
                </button>

            </div>


            <div id="items">

                <p class="muted">
                    正在載入抽選品項…
                </p>

            </div>

        </section>


        <!-- =================================================
             使用說明
        ================================================== -->

        <section class="section">

            <h2>
                💡 使用方式
            </h2>


            <div class="post">

                <div class="post-items">

                    <strong>
                        ①
                    </strong>

                    選擇要抽選的店家。

                    <br><br>


                    <strong>
                        ②
                    </strong>

                    勾選想要抽選的品項。

                    <br><br>


                    <strong>
                        ③
                    </strong>

                    按下「開始抽選」。

                    <br><br>


                    <strong>
                        ④
                    </strong>

                    網站會開啟第一個 LINE 抽選。

                    <br><br>


                    <strong>
                        ⑤
                    </strong>

                    完成 LINE 抽選後，回到這個網站。

                    <br><br>


                    <strong>
                        ⑥
                    </strong>

                    按「下一個」開啟下一個抽選。

                    <br><br>


                    <strong>
                        ⑦
                    </strong>

                    全部完成後會顯示抽選完成。

                </div>

            </div>

        </section>


        <!-- =================================================
             資料更新
        ================================================== -->

        <section class="section">

            <div
                id="lastSync"
                class="muted"
                style="text-align:center;"
            >
                資料載入中…
            </div>

        </section>


    </main>


    <!-- =====================================================
         JavaScript
    ====================================================== -->

    <script
        src="assets/app.js"
    ></script>


</body>

</html>
